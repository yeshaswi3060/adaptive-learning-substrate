# RESERVED CONFIRMATORY CONFIGURATION — DO NOT RUN.
# Execution remains blocked until code, configs, baselines, analysis, hashes,
# and the Experiment 000 development report are frozen and independently checked.

[protocol]
name = "experiment_000_delayed_chain"
version = "experiment-000-data-v1"
implementation_revision = "C000.1"
scope = "reserved_confirmatory"
confirmatory = true
status = "reserved_not_run"

[execution]
enabled = false
must_not_run = true
required_seed_role = "confirmatory"
reserved_seeds = [
  1000, 1001, 1002, 1003, 1004,
  1005, 1006, 1007, 1008, 1009,
  1010, 1011, 1012, 1013, 1014,
  1015, 1016, 1017, 1018, 1019,
]
paired_methods = ["ccf_v0", "ccf_no_trace", "rand"]
unblock_requires = [
  "frozen_source_hash",
  "frozen_environment_hash",
  "frozen_development_config_hash",
  "frozen_confirmatory_config_hash",
  "frozen_analysis_script_hash",
  "frozen_baseline_implementations",
  "passing_integrity_tests",
  "completed_development_report",
]

[data]
episodes_per_split = 2000
noise_events = 8
exact_cue_balance = true
terminal_feedback_only = true
evaluation_learning = false

[graph]
hidden_count = 64
recurrent_in_degree = 8
input_fan_out = 8
output_fan_in = 16
edge_delay_ticks = 1
query_readout_latency_ticks = 2
initial_weight_scale = 0.35
topology_frozen = true

[ccf]
activation = "tanh"
float_type = "float64"
emit_threshold = 1e-3
learning_rate = 0.01
trace_decay = 0.97
route_gain = 0.90
credit_limit = 1.0
max_update = 0.05
weight_clip = 3.0
trace_horizon = 32
hop_limit = 16
epsilon_weight = 1e-12
epsilon_message = 1e-12
epsilon_route = 1e-12
credit_minimum = 1e-8

[evaluation]
primary_delay = 8
mean_accuracy_min = 0.90
seeds_at_or_above_count = 16
per_seed_accuracy_floor = 0.85
mean_advantage_over_rand_min = 0.25
mean_advantage_over_no_trace_min = 0.15
paired_bootstrap_resamples = 10000
paired_sign_flip_samples = 100000
familywise_alpha = 0.05
analysis_seed = 20260901

[output]
directory = "artifacts/experiment_000/confirmatory"
write_event_log = false
write_episode_log = true
write_audit_sample = false
write_seed_manifest = true
write_topology_hashes = true
write_compute_ledger = true
