# Development-only recurrent Experiment 000.
# These seeds may be used for debugging and tuning. Results are not confirmatory.

[protocol]
name = "experiment_000_delayed_chain"
version = "experiment-000-data-v1"
implementation_revision = "C000.1"
scope = "development_only"
confirmatory = false

[execution]
enabled = true
required_seed_role = "development"
seeds = [0, 1, 2, 3, 4]
paired_methods = ["ccf_v0", "ccf_no_trace", "rand"]

[data]
episodes_per_split = 2000
noise_events = 8
exact_cue_balance = true
terminal_feedback_only = true
evaluation_learning = false

[graph]
hidden_count = 64
recurrent_in_degree = 8
input_fan_out = 8
output_fan_in = 16
edge_delay_ticks = 1
query_readout_latency_ticks = 2
initial_weight_scale = 0.35
topology_frozen = true

[ccf]
activation = "tanh"
float_type = "float64"
emit_threshold = 1e-3
learning_rate = 0.01
trace_decay = 0.97
route_gain = 0.90
credit_limit = 1.0
max_update = 0.05
weight_clip = 3.0
trace_horizon = 32
hop_limit = 16
epsilon_weight = 1e-12
epsilon_message = 1e-12
epsilon_route = 1e-12
credit_minimum = 1e-8

[evaluation]
primary_delay = 8
mean_accuracy_min = 0.90
seeds_at_or_above_count = 16
per_seed_accuracy_floor = 0.85
mean_advantage_over_rand_min = 0.25
mean_advantage_over_no_trace_min = 0.15

[output]
directory = "artifacts/experiment_000/development"
write_event_log = false
write_episode_log = true
write_audit_sample = true
write_seed_manifest = true
write_topology_hashes = true
write_compute_ledger = true
