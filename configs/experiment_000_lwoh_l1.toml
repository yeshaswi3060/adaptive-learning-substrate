[learner]
condition = "lwoh_head"
parameters = 8
bias_parameters = 0
initial_theta = 0.0
prediction_equation = "q=tanh(theta^T*z)"
tie_prediction = 1
loss_equation = "0.5*(y-q)^2"
normalizer_equation = "max(1,||z||^2)"
learning_rate = 0.5
delta_coordinate_clip = 0.05
theta_coordinate_clip = 3.0
target_encoding = "bipolar_-1_+1"
target_available_before_prediction = false
passes_per_training_stream = 1
replay = false

[head_alignment_tests]
