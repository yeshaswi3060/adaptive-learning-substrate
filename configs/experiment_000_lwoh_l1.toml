A02_seed_c_multiple_min = 3.0
A02_seed_count_min = 4
A03_median_ratio_min = 0.50
A04_median_ratio_multiple_min = 3.0
A05_seed_ratio_multiple_min = 3.0
A05_seed_count_min = 4
