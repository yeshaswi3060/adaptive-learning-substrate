[graph]
hidden_count = 64
recurrent_in_degree = 8
input_fan_out = 8
output_fan_in = 16
initial_weight_scale = 0.35
edge_delay_ticks = 1
query_readout_latency_ticks = 2
activation = "tanh"
emit_threshold = 0.001
dtype = "float64"
device = "cpu"
autograd = false
gpu = false
ccf_calls = 0
topology_frozen = true
weights_frozen = true

[memory]
name = "local_write_once_hard_expiring_latch"
condition = "write_once_ttl32"
selected_nodes = "lexically_ordered_destinations_of_input_cue_edges"
feature_dimension = 8
state_floats = 8
state_ticks = 8
state_bits = 8
initial_m = 0.0
initial_kappa = 0
initial_b = 0
gate_equation = "g_i(t)=1-b_i"
value_equation = "m_i=clip(g_i(t)*a_i(t)+(1-g_i(t))*m_i,-1,+1)"
tick_equation = "kappa_i=g_i(t)*t+(1-g_i(t))*kappa_i"
written_equation = "b_i=1"
effective_equation = "z_i(T)=m_i iff b_i=1 and 0<=T-kappa_i<=32 else +0.0"
hard_horizon_ticks = 32
maximum_official_query_age_ticks = 18
horizon_derivation = "smallest_power_of_two_strictly_above_18"
touch_only_on_real_hidden_evaluation = true
read_only_at_query = true
enters_recurrent_dynamics = false
creates_events_or_messages = false
crosses_episode_boundary = false

[admission]
seeds = [90, 91, 92, 93, 94]
distractors = 8
pairs_per_split = 100
counterfactual_cues = [-1, 1]
ridge_alpha = 0.001
candidate_feature = "lwoh_8d"
native_feature = "latest_activation_same_8_nodes"
candidate_output_equation = "tanh(sum_i input_cue_weight_i*z_i)"
native_output = "ordinary_forced_output"
candidate_grid_size = 1
online_learning = false
zero_guard = "positive_over_zero_passes_ratio_by_cross_multiplication;zero_over_zero_fails"
terminal_pass = "LWOH_ADMITTED:write_once_ttl32"
terminal_fail_prefix = "LWOH_ADMISSION_FAIL:"
require_primary_and_rerun = true
require_canonical_payload_equality = true

[admission.gates]
