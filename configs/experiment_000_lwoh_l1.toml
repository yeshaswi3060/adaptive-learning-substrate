require_phase_and_source_integrity = true

[seed_partition]
admission = [90, 91, 92, 93, 94]
learning = [95, 96, 97, 98, 99, 100, 101, 102, 103, 104]
scratch = [9090, 9091]
forbidden_development = [0, 1, 2, 3, 4]
forbidden_alignment = [42, 43, 44, 45, 46]
