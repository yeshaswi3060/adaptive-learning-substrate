[hashing]
algorithm = "sha256"
canonical_json = "sorted_keys_compact_separators_ascii_allow_nan_false"
array_encoding = "shape_plus_contiguous_little_endian_float64_bytes"
exclude_from_deterministic_payload = [
    "runtime",
    "timestamps",
    "absolute_paths",
    "machine_text",
    "worker_completion_order",
    "process_ids",
]

[cli]
module = "adaptive_learning_substrate.experiment_000_readout_trace_a2"
seed_argument = "--seeds 70 71 72 73 74"
retention_argument = "--retentions 0.25 0.50 0.75 0.90 0.95"
ridge_argument = "--ridge-alpha 0.001"
worker_argument = "--workers 5"
smoke_pairs_argument = "--pairs-per-split 2"
full_pairs_argument = "--pairs-per-split 100"
reject_omitted_duplicate_nonfinite_out_of_order_or_extra_values = true
