write_pair_rows = true
write_condition_rows = true
write_stability_rows = true
write_trace_touch_rows = true
write_source_start_and_end_manifests = true
write_gate_decisions = true

[determinism]
full_run_count = 2
require_payload_sha256_match = true
require_report_file_sidecars_match = true
require_selection_objects_match = true
require_source_start_end_and_freeze_hashes_match = true
nondeterministic_status = "NONDETERMINISTIC_INVALID"
invalid_native_status = "INVALID_NATIVE_CONTROL"
invalid_procedure_status = "INVALID_PROCEDURE_NONSELECTING"
valid_terminal_statuses = ["SELECTED:<condition>", "NO_SELECTION"]
quartile_probabilities = [0.25, 0.50, 0.75]
quartile_algorithm = "numpy_quantile_method_linear"

[downstream_credit_contract]
selection_type = "representation_only"
actual_candidate_output_uses_passive_trace_readout = true
current_trace_readout_has_causal_unit_event_path = false
current_trace_readout_has_causal_edge_trace_path = false
