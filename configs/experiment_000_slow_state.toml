first_sentinel_processing_counts_read_decay_write = true
omission_holds_retained_term_fixed = true
sources_and_output_remain_native = true
effective_state_observation_is_nonmutating = true
structural_hash_detects_plastic_only_change = true
numeric_absolute_tolerance = 1e-12
numeric_relative_tolerance = 1e-12

[cli]
module = "adaptive_learning_substrate.experiment_000_slow_state"
seed_argument = "--seeds 60 61 62 63 64"
retention_argument = "--retentions 0.25 0.50 0.75 0.90 0.95"
ridge_argument = "--ridge-alpha 0.001"
smoke_pairs_argument = "--pairs-per-split 2"
full_pairs_argument = "--pairs-per-split 100"
reject_omitted_or_duplicate_values = true
reject_nonfinite_values = true
reject_out_of_order_or_extra_values = true

[hashing]
algorithm = "sha256"
canonical_json = "sorted_keys_compact_separators_ascii_allow_nan_false"
array_encoding = "shape_plus_contiguous_little_endian_float64_bytes"
weight_map_order = "selected_edges_sorted_by_edge_id"
weight_map_prefix = "ascii_str_tuple_row_count_then_NUL"
weight_map_row_framing = "utf8_edge_id_then_NUL_then_one_contiguous_little_endian_float64_then_LF"
weight_map_kinds = ["all", "input", "recurrent", "output"]
require_direct_bitwise_float64_equality = true
exclude_from_deterministic_payload = ["runtime", "timestamps", "absolute_paths", "machine_text"]

[output]
directory = "artifacts/experiment_000/slow_state"
smoke_report = "smoke_pairs_2.json"
smoke_report_hash_sidecar = "smoke_pairs_2.sha256"
primary_report = "custom_seeds_60_64_pairs_100.json"
rerun_report = "custom_seeds_60_64_pairs_100_rerun.json"
primary_report_hash_sidecar = "custom_seeds_60_64_pairs_100.sha256"
rerun_report_hash_sidecar = "custom_seeds_60_64_pairs_100_rerun.sha256"
write_pair_rows = true
write_condition_rows = true
write_stability_rows = true
write_state_touch_rows = true
write_saturation_rows = true
write_provenance = true
write_gate_decisions = true
